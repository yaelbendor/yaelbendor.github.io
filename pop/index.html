<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pop &amp; Pluck</title>
<meta name="description" content="A cozy little skin spa. Pinch with two fingers to pop and pluck.">
<meta name="theme-color" content="#ffe3e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pop &amp; Pluck">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='26' fill='%23fff4ec' stroke='%23e6b3a3' stroke-width='4'/%3E%3Ccircle cx='32' cy='34' r='10' fill='%23ff8fa6'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23fffaf0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#6b4660; --pink:#ff7f9e; --pink2:#ffb3c6; --cream:#fffaf3; --mint:#9fdcc0;
  --shadow:0 6px 0 rgba(150,80,110,.18), 0 14px 30px rgba(150,80,110,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#ffe3e8;touch-action:none;overscroll-behavior:none}
body{font-family:Fredoka,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color:var(--plum);position:fixed;inset:0}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;gap:8px;align-items:center;pointer-events:none;transition:opacity .4s, transform .5s cubic-bezier(.3,1.6,.5,1)}
#hud.off{opacity:0;transform:translateY(-30px)}
.pill{pointer-events:auto;background:var(--cream);border-radius:999px;padding:7px 13px;font-weight:600;font-size:15px;box-shadow:0 3px 0 rgba(150,80,110,.15);white-space:nowrap;display:flex;align-items:center;gap:6px}
#who small{opacity:.55;font-weight:500}
#barWrap{flex:1;min-width:60px;height:16px;background:rgba(255,255,255,.65);border-radius:99px;position:relative;box-shadow:inset 0 2px 0 rgba(150,80,110,.12)}
#bar{position:absolute;left:3px;top:3px;bottom:3px;width:0;border-radius:99px;background:linear-gradient(90deg,#ffb3c6,#ff7f9e);transition:width .35s cubic-bezier(.3,1.6,.5,1)}
#barWrap::after{content:"✨";position:absolute;right:-6px;top:50%;transform:translateY(-50%);font-size:16px}
#score{min-width:62px;justify-content:center}
#score.bump{animation:bump .25s ease}
@keyframes bump{40%{transform:scale(1.25)}}
.ib{pointer-events:auto;border:0;background:var(--cream);width:36px;height:36px;border-radius:50%;font-size:17px;box-shadow:0 3px 0 rgba(150,80,110,.15);display:grid;place-items:center;padding:0;cursor:pointer;color:var(--plum)}
.ib.muted{opacity:.45}
.ib:active,.btn:active{transform:translateY(2px) scale(.96)}

/* Screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .45s}
.screen.hide{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .45s,visibility 0s .45s}
.screen.hide *{pointer-events:none!important}
#title{background:radial-gradient(ellipse at 50% 60%,rgba(255,240,244,.0) 0%,rgba(255,232,238,.55) 70%);justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 7vh)}
.logo{font-size:clamp(46px,14vw,78px);font-weight:700;line-height:.95;letter-spacing:-.5px;color:#fff;-webkit-text-stroke:0;text-shadow:0 4px 0 #ff7f9e,0 -3px 0 #ff7f9e,3px 0 0 #ff7f9e,-3px 0 0 #ff7f9e,3px 3px 0 #ff7f9e,-3px 3px 0 #ff7f9e,3px -3px 0 #ff7f9e,-3px -3px 0 #ff7f9e,0 10px 0 rgba(150,80,110,.25)}
.logo span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
.logo .amp{color:#ffe17a}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.sub{margin-top:14px;font-size:18px;font-weight:600;opacity:.8}
.btn{pointer-events:auto;border:0;font-family:inherit;font-weight:700;font-size:22px;color:#fff;background:linear-gradient(#ff97b2,#ff7095);padding:16px 34px;border-radius:999px;box-shadow:0 6px 0 #d9557a,0 14px 26px rgba(217,85,122,.35);cursor:pointer;letter-spacing:.3px}
.btn.alt{background:linear-gradient(#9ee6c4,#6fcfa6);box-shadow:0 6px 0 #48a982,0 14px 26px rgba(72,169,130,.35)}
#title .btn{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 13vh);animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.howto{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 4vh);font-size:14px;font-weight:500;opacity:.75;max-width:320px;line-height:1.35;background:rgba(255,250,243,.8);padding:8px 14px;border-radius:14px}

#win{background:linear-gradient(rgba(255,220,230,0) 40%,rgba(255,220,230,.5));justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
.card{background:var(--cream);border-radius:30px;padding:20px 24px 26px;width:min(330px,88vw);box-shadow:var(--shadow);transform:scale(.6);opacity:0;transition:transform .5s cubic-bezier(.3,1.7,.5,1),opacity .25s}
#win:not(.hide) .card{transform:scale(1);opacity:1}
.card h2{margin:0;font-size:30px;color:var(--pink);line-height:1.1}
.card p{margin:4px 0 0;font-size:16px;font-weight:500;opacity:.8}
.row{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 12px}
.stars{font-size:36px;letter-spacing:4px}
.stars span{display:inline-block;color:#eadbe0;transform:scale(0);transition:transform .45s cubic-bezier(.3,2,.5,1)}
.stars span.on{color:#ffcf4a;text-shadow:0 3px 0 #f0a92a}
.stars span.show{transform:scale(1)}
.big{font-size:24px;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%) translateY(80px);background:var(--cream);padding:9px 16px;border-radius:99px;font-weight:600;font-size:15px;box-shadow:0 3px 0 rgba(150,80,110,.15);transition:transform .4s cubic-bezier(.3,1.6,.5,1);white-space:nowrap;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="off">
  <div class="pill" id="who">Mochi <small>#1</small></div>
  <div id="barWrap"><div id="bar"></div></div>
  <div class="pill" id="score">⭐ <b id="scoreN">0</b></div>
  <button class="ib" id="bSfx" aria-label="Sound effects">🔊</button>
  <button class="ib" id="bMus" aria-label="Music">🎵</button>
</div>

<div id="title" class="screen">
  <div class="logo" id="logo"></div>
  <div class="sub">a cozy little skin spa ✿</div>
  <button class="btn" id="play">Open the spa ✨</button>
  <div class="howto">Use <b>two fingers</b>: pinch a bump to <b>pop</b> it, or pinch a hair and <b>pull</b> 🔊 sound on!</div>
</div>

<div id="win" class="screen hide">
  <div class="card">
    <h2>So glowy!</h2>
    <p id="winMsg">Mochi feels brand new</p>
    <div class="row"><div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div>
    <div class="big" id="winScore">+0</div></div>
    <button class="btn alt" id="next">Next client →</button>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
/* ============================================================
   Pop & Pluck: a cozy skin spa. Everything is drawn & synthesized in code.
   ============================================================ */
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const easeOutBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutElastic = t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1;
const easeInBack = t => 2.7 * t * t * t - 1.7 * t * t;

/* ---------- save ---------- */
const SAVE_KEY = 'popPluck.v1';
const save = Object.assign({ level: 1, total: 0, tutPop: false, tutPull: false, sfx: true, music: true },
  (() => { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } })());
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

/* ---------- haptics ---------- */
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

/* ============================================================
   AUDIO: all synthesized with Web Audio
   ============================================================ */
const SFX = (() => {
  let ac = null, master, sfxBus, musBus, verb, noiseBuf;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function impulse(sec, decay) {
    const len = ac.sampleRate * sec, b = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return b;
  }
  function init() {
    if (ac) { if (ac.state !== 'running') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = .003; comp.release.value = .2;
    master = ac.createGain(); master.gain.value = .9; master.connect(comp); comp.connect(ac.destination);
    verb = ac.createConvolver(); verb.buffer = impulse(2.2, 3);
    const vOut = ac.createGain(); vOut.gain.value = .5; verb.connect(vOut); vOut.connect(master);
    sfxBus = ac.createGain(); sfxBus.gain.value = save.sfx ? 1 : 0; sfxBus.connect(master);
    const sSend = ac.createGain(); sSend.gain.value = .18; sfxBus.connect(sSend); sSend.connect(verb);
    musBus = ac.createGain(); musBus.gain.value = save.music ? .55 : 0; musBus.connect(master);
    const mSend = ac.createGain(); mSend.gain.value = .6; musBus.connect(mSend); mSend.connect(verb);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    // iOS unlock blip
    const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(0);
    startMusic();
  }
  const ok = () => ac && ac.state === 'running';

  function env(g, t0, a, v, dur) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }
  function tone(o) {
    if (!ok()) return;
    const t0 = ac.currentTime + (o.when || 0);
    const osc = ac.createOscillator(); osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + (o.slide || o.t));
    if (o.det) osc.detune.value = o.det;
    const g = ac.createGain(); env(g, t0, o.a || .004, o.v || .3, o.t);
    let node = osc;
    if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; osc.connect(f); node = f; }
    node.connect(g); g.connect(o.dest || sfxBus);
    osc.start(t0); osc.stop(t0 + o.t + .05);
  }
  function noise(o) {
    if (!ok()) return;
    const t0 = ac.currentTime + (o.when || 0);
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = o.type || 'bandpass'; f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f, t0); if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t0 + o.t);
    const g = ac.createGain(); env(g, t0, o.a || .003, o.v || .2, o.t);
    src.connect(f); f.connect(g); g.connect(o.dest || sfxBus);
    src.start(t0, Math.random() * .5); src.stop(t0 + o.t + .05);
  }
  function bell(f, when = 0, v = .12, dur = 1, dest) {
    tone({ f, t: dur, v, when, dest, a: .003 });
    tone({ f: f * 2.0, t: dur * .45, v: v * .3, when, dest, a: .003 });
    tone({ f: f * 3.01, t: dur * .18, v: v * .12, when, dest, a: .002 });
  }
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];

  /* continuous loops (squeeze squeak / hair creak) */
  function loop(kind) {
    if (!ok()) return { set() {}, stop() {} };
    const t0 = ac.currentTime;
    const out = ac.createGain(); out.gain.value = 0; out.connect(sfxBus);
    const osc = ac.createOscillator(); osc.type = kind === 'hair' ? 'sawtooth' : 'sine';
    const lfo = ac.createOscillator(); lfo.frequency.value = kind === 'hair' ? 28 : 7;
    const lg = ac.createGain(); lg.gain.value = kind === 'hair' ? 0 : 14;
    lfo.connect(lg); lg.connect(osc.frequency);
    const og = ac.createGain(); og.gain.value = 0;
    let filt = null;
    if (kind === 'hair') {
      // tremolo creak
      filt = ac.createBiquadFilter(); filt.type = 'bandpass'; filt.Q.value = 6; filt.frequency.value = 900;
      const trem = ac.createGain(); trem.gain.value = .5;
      const tg = ac.createGain(); tg.gain.value = .5; lfo.connect(tg); tg.connect(trem.gain);
      osc.connect(filt); filt.connect(trem); trem.connect(og);
    } else osc.connect(og);
    og.connect(out);
    // squishy noise
    const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const nf = ac.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 300; nf.Q.value = 3;
    const ng = ac.createGain(); ng.gain.value = 0;
    n.connect(nf); nf.connect(ng); ng.connect(out);
    osc.frequency.value = 200; osc.start(t0); lfo.start(t0); n.start(t0);
    out.gain.setTargetAtTime(1, t0, .02);
    return {
      set(p, extra = 0) {
        const t = ac.currentTime;
        if (kind === 'hair') {
          osc.frequency.setTargetAtTime(90 + p * 160, t, .03);
          lfo.frequency.setTargetAtTime(18 + p * 30, t, .05);
          filt.frequency.setTargetAtTime(600 + p * 1600, t, .05);
          og.gain.setTargetAtTime(p * .16, t, .03);
          ng.gain.setTargetAtTime(p * .05, t, .03); nf.frequency.setTargetAtTime(1200 + p * 2000, t, .05);
        } else {
          osc.frequency.setTargetAtTime(260 + p * 520 + extra * 400, t, .03);
          lg.gain.setTargetAtTime(10 + extra * 40, t, .05);
          lfo.frequency.setTargetAtTime(6 + extra * 18, t, .05);
          og.gain.setTargetAtTime(p * p * .09 + extra * .03, t, .03);
          ng.gain.setTargetAtTime(p * .1, t, .03); nf.frequency.setTargetAtTime(250 + p * 900, t, .04);
        }
      },
      stop() {
        const t = ac.currentTime;
        out.gain.setTargetAtTime(0, t, .025);
        osc.stop(t + .2); lfo.stop(t + .2); n.stop(t + .2);
      }
    };
  }

  const api = {
    init,
    get ctx() { return ac; },
    setSfx(on) { save.sfx = on; if (sfxBus) sfxBus.gain.setTargetAtTime(on ? 1 : 0, ac.currentTime, .05); },
    setMusic(on) { save.music = on; if (musBus) musBus.gain.setTargetAtTime(on ? .55 : 0, ac.currentTime, .3); },
    suspend() { if (ac) ac.suspend(); }, resume() { if (ac) ac.resume(); },
    loop,
    pop(pitch = 1, kind = 'small') {
      const b = kind === 'big' ? .7 : 1;
      tone({ f: 1100 * pitch * b, f2: 180 * pitch * b, t: .11, v: .55 });
      tone({ f: 2200 * pitch, f2: 700, t: .045, v: .14, type: 'triangle' });
      noise({ t: .045, f: 2600 * pitch, q: 1.4, v: .35 });
      if (kind !== 'small') {
        tone({ f: 260, f2: 70, t: .3, v: .45 });
        for (let i = 0; i < 6; i++) { const f = rand(500, 1100); tone({ f, f2: f * 1.9, t: .06, v: .1, when: .03 + i * .045 }); }
      }
    },
    sparkle(level = 0) {
      const base = 76 + Math.min(level, 8) * 2;
      for (let i = 0; i < 3; i++) bell(mtof(base + PENTA[i * 2 + (level % 2)]), .03 + i * .055, .08, .8);
    },
    pluck() {
      tone({ f: 220, f2: 1600, t: .14, slide: .11, v: .26, type: 'triangle' });
      noise({ t: .09, type: 'highpass', f: 2500, v: .22 });
      tone({ f: 900, f2: 160, t: .12, v: .5, when: .03 });
      noise({ t: .05, f: 1800, q: 1.2, v: .3, when: .03 });
    },
    boing(v = .3) {
      if (!ok()) return;
      const t0 = ac.currentTime, osc = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain(), g = ac.createGain();
      osc.frequency.value = 230; lfo.frequency.value = 16;
      lg.gain.setValueAtTime(90, t0); lg.gain.exponentialRampToValueAtTime(1, t0 + .45);
      lfo.connect(lg); lg.connect(osc.frequency); osc.connect(g); g.connect(sfxBus);
      env(g, t0, .005, v, .45); osc.start(t0); lfo.start(t0); osc.stop(t0 + .5); lfo.stop(t0 + .5);
    },
    giggle() {
      const p = rand(.9, 1.15), notes = [880, 1046, 932];
      for (let i = 0; i < 3; i++) {
        tone({ f: notes[i] * p, f2: notes[i] * p * .8, t: .085, v: .13, type: 'triangle', when: i * .1, lp: 2400 });
        tone({ f: notes[i] * p * 2, f2: notes[i] * p * 1.6, t: .05, v: .03, when: i * .1 });
      }
    },
    eep() { tone({ f: 600, f2: 1400, t: .16, v: .14, type: 'triangle', lp: 3000 }); tone({ f: 1200, f2: 2600, t: .1, v: .04 }); },
    sigh() { tone({ f: 700, f2: 420, t: .45, slide: .4, v: .1, type: 'triangle', lp: 1800, a: .04 }); },
    click() { tone({ f: 1300, f2: 900, t: .05, v: .16 }); },
    whoosh() { noise({ t: .4, f: 300, f2: 2600, q: 2.5, v: .22, a: .08 }); },
    collect(i = 0) { bell(mtof(88 + PENTA[i % 6]), 0, .05, .35); },
    tick(p) { tone({ f: 1500 + p * 1500, t: .025, v: .05, type: 'triangle' }); },
    slip() { this.boing(.25); tone({ f: 500, f2: 200, t: .3, v: .12, type: 'triangle', lp: 1500 }); },
    win() {
      [72, 76, 79, 84, 88, 91].forEach((m, i) => bell(mtof(m), i * .085, .12, 1.4));
      [60, 64, 67, 71].forEach(m => tone({ f: mtof(m), t: 1.8, v: .05, type: 'triangle', a: .2, when: .5, lp: 1500 }));
      for (let i = 0; i < 10; i++) bell(mtof(96 + PENTA[(Math.random() * 6) | 0]), .6 + i * .07, .03, .5);
    },
    star(i) { bell(mtof(79 + [0, 4, 7][i]), 0, .14, 1); tone({ f: 300 + i * 120, f2: 900 + i * 200, t: .12, v: .08, type: 'triangle' }); },
  };

  /* ---------- cozy music box + pad ---------- */
  let mTimer = null, nextT = 0, step = 0;
  const CHORDS = [[60, 64, 67, 71], [57, 60, 64, 67], [53, 57, 60, 64], [55, 59, 62, 65]];
  function startMusic() {
    nextT = ac.currentTime + .2;
    mTimer = setInterval(() => {
      if (!ok()) return;
      while (nextT < ac.currentTime + .25) { sched(step, nextT); step++; nextT += 60 / 78 / 2; }
    }, 40);
  }
  function sched(s, t) {
    const ch = CHORDS[Math.floor(s / 8) % 4], when = t - ac.currentTime, eighth = 60 / 78 / 2;
    if (s % 8 === 0) {
      ch.forEach(m => {
        tone({ f: mtof(m - 12), t: eighth * 8.5, v: .022, type: 'triangle', a: .9, when, lp: 900, dest: musBus, det: -6 });
        tone({ f: mtof(m - 12), t: eighth * 8.5, v: .022, type: 'triangle', a: .9, when, lp: 900, dest: musBus, det: 7 });
      });
      tone({ f: mtof(ch[0] - 24), t: eighth * 3.5, v: .09, a: .02, when, dest: musBus });
    }
    if (s % 8 === 4) tone({ f: mtof(ch[0] - 24 + 7), t: eighth * 3, v: .06, a: .02, when, dest: musBus });
    const melodic = (s % 2 === 0) ? Math.random() < .7 : Math.random() < .25;
    if (melodic) {
      const pool = ch.map(m => m + 12).concat(ch.map(m => m + 24));
      bell(mtof(pick(pool)), when, .035, 1.4, musBus);
    }
  }
  return api;
})();

/* ============================================================
   CLIENTS
   ============================================================ */
const CLIENTS = [

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt) {
  time += dt;

  if (state === 'trans') {
    if (exitT >= 0) {
      exitT += dt / .45; offX = -easeInBack(Math.min(exitT, 1)) * W * 1.2;
      if (exitT >= 1) { exitT = -1; genLevel(save.level); buildBg(); enterT = 0; particles = []; }
    } else if (enterT < 1) {
      enterT = Math.min(1, enterT + dt / .9); offX = (1 - easeOutBack(enterT)) * W * 1.2;
      if (enterT >= 1) { state = 'play'; offX = 0; wob.v += 8; SFX.boing(.2); say(pick(SAY_HI).replace('{n}', client.name), 2); SFX.giggle(); }
    }
  }
  hx = n => head.cx + offX + n * head.r * (1 + wob.x * .045);
  const lift = winGlow > 0 ? -easeOutBack(Math.min(1, winGlow * 1.6)) * H * .1 : 0;
  hy = n => head.cy + lift + n * head.r * (1 - wob.x * .045 + Math.sin(time * 2.2) * .006);

  if (hitstop > 0) { hitstop -= dt; dt *= .08; }

  // blink
  blinkT -= dt; if (blinkT < 0) { blinkP = 1; blinkT = rand(2, 4.5); }
  blinkP = Math.max(0, blinkP - dt * 7);
  if (exprT < 90) { exprT -= dt; if (exprT <= 0 && expr !== 'idle' && !action) expr = 'idle'; }

  updateAction(dt);

  // combo
  if (comboT > 0) comboT -= dt;
  // clear check
  if (clearedT > 0 && state === 'play' && !action) { clearedT -= dt; if (clearedT <= 0) doWin(); }
  if (winGlow > 0) winGlow = Math.min(1, winGlow + dt * .8);

  // look target
  if (!action) {
    const t = touches()[0] || [...pointers.values()][0];
    if (t) { look.tx = t.x; look.ty = t.y; }
    else { look.tx = hx(0) + Math.sin(time * .5) * head.r * .6; look.ty = hy(.1) + Math.cos(time * .7) * head.r * .3; }
  }
  const ldx = look.tx - hx(0), ldy = look.ty - hy(-.04), ll = Math.hypot(ldx, ldy) || 1, lm = Math.min(1, ll / head.r);

  for (const p of pimples) {

    if (!action || action.p !== p) { p.pressure *= Math.exp(-dt * 10); p.hold = Math.max(0, p.hold - dt * 3); p.tick = 0; }
    if (p.popped && p.mark > 0) p.mark -= dt * .6;
    if (!p.popped && p.kind === 'gold' && Math.random() < dt * 3) { const P = pimplePos(p); burst(P.x + rand(-12, 12) * S, P.y + rand(-12, 12) * S, 1, ['sparkle'], ['#fff', '#ffe17a'], 20); }
  }
  for (const h of hairs) {
    h.wv += (-180 * h.wx - 6 * h.wv) * dt; h.wx += h.wv * dt;
    if (!action || action.h !== h) h.tension *= Math.exp(-dt * 14);
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (p.type === 'ring') continue;
    const dr = Math.exp(-p.drag * dt);

  // flyers
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i]; f.t += dt;
    if (f.t < f.home) { f.vy += 1100 * dt; f.vx *= Math.exp(-1.5 * dt); f.x += f.vx * dt; f.y += f.vy * dt; f.rot += (f.vr || 4) * dt; }

    }
  }

  if (bubbles.length < 10 && Math.random() < dt * 1.5) bubbles.push({ x: rand(0, W), y: H + 20, r: rand(5, 16), sp: rand(20, 45), ph: rand(0, TAU) });
  for (let i = bubbles.length - 1; i >= 0; i--) { const b = bubbles[i]; b.y -= b.sp * dt; b.x += Math.sin(time * 1.3 + b.ph) * 10 * dt; if (b.y < -30) bubbles.splice(i, 1); }
  if (speech) { speech.t += dt; if (speech.t > speech.life) speech = null; }
  shake *= Math.exp(-dt * 12); flash *= Math.exp(-dt * 9);

  if (state === 'play' && !action && enterT >= 1) idleT += dt; else idleT = 0;
}

  $('#bar').style.width = `calc(${(done / total) * 100}% - ${done / total * 6}px)`;
  $('#who').innerHTML = `${client.name} <small>#${save.level}</small>`;
  $('#scoreN').textContent = save.total;
}

/* ============================================================

}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(bgCanvas, 0, 0, W, H);

}

    case 'sparkle': sparklePath(ctx, 0, 0, s); ctx.fill(); break;
    case 'foam': ell(0, 0, s, s); ctx.fill(); ctx.strokeStyle = '#f4d9c5'; ctx.lineWidth = 1.2; ctx.stroke(); break;
    case 'conf': ctx.scale(1, Math.cos(p.flip)); ctx.fillRect(-s / 2, -s * .3, s, s * .6); break;
    default: ell(0, 0, s, s); ctx.fill();
  }
  ctx.restore(); ctx.globalAlpha = 1;
}
function drawFlyer(f) {
  ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
  const homing = f.t > f.home ? clamp(1 - (f.t - f.home) * 1.6, .35, 1) : 1;
  if (f.kind === 'star') {
    const s = 11 * Math.max(S, .8) * homing;
    ctx.fillStyle = f.col; starPath(ctx, 0, 0, s); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  } else {
    const sc = 1.5 * homing * Math.min(1, f.t * 6 + .6), r = head.r, L = f.h.len * r * 1.1;
    ctx.scale(sc, sc);
    const pts = [];
    for (let i = 0; i <= 10; i++) { const s = i / 10; pts.push({ x: Math.sin(s * Math.PI * 2.2 + time * 6) * f.h.curl * L * .12 * (.3 + s), y: -s * L }); }
    ctx.strokeStyle = f.h.col; ctx.lineWidth = Math.max(2.6, 3.6 * S); strokePts(pts);
    drawRoot(0, 0, r * .07);
  }
  ctx.restore();
}
function drawText(t) {
  const a = t.t < .3 ? easeOutElastic(t.t / .3) : 1, fade = clamp((t.life - t.t) / .3, 0, 1);
  ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.rot); ctx.scale(a, a);
  ctx.globalAlpha *= fade;
  ctx.font = `700 ${t.size}px Fredoka, ui-rounded, system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = t.size * .32; ctx.strokeStyle = t.col; ctx.strokeText(t.txt, 0, 0);
  ctx.fillStyle = '#fff'; ctx.fillText(t.txt, 0, 0);
  ctx.restore();
}
function drawSpeech() {
  if (!speech) return;
  const k = speech.t < .25 ? easeOutBack(speech.t / .25) : 1, fade = clamp((speech.life - speech.t) / .25, 0, 1);
  const x = hx(.62), y = hy(-1.25) - 10, fs = Math.max(16, 19 * Math.min(S, 1.15));
  ctx.font = `600 ${fs}px Fredoka, ui-rounded, system-ui, sans-serif`;
  const w = ctx.measureText(speech.txt).width + 26, h = fs + 18;
  const bx = clamp(x, w / 2 + 8, W - w / 2 - 8);
  ctx.save(); ctx.globalAlpha = fade; ctx.translate(bx, y); ctx.scale(k, k);
  ctx.fillStyle = '#fffaf3'; roundRect(ctx, -w / 2, -h / 2, w, h, h / 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - bx - 14, h / 2 - 2); ctx.lineTo(x - bx - 26, h / 2 + 12); ctx.lineTo(x - bx, h / 2 - 2); ctx.fill();
  ctx.fillStyle = '#6b4660'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(speech.txt, 0, 1);
  ctx.restore();
}

/* ---------- colour utils ---------- */
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function hexA(h, a) { const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; }
function lighten(h) { const [r, g, b] = hexToRgb(h); return `rgb(${Math.min(255, r + 12)},${Math.min(255, g + 12)},${Math.min(255, b + 12)})`; }
function lerpCol(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; }

/* ============================================================
   LOOP & UI wiring
   ============================================================ */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}

// logo letters
$('#logo').innerHTML = 'Pop & Pluck'.split('').map((ch, i) => ch === ' ' ? ' ' : `<span class="${ch === '&' ? 'amp' : ''}" style="animation-delay:${i * .09}s">${ch === '&' ? '&amp;' : ch}</span>`).join('').replace('&amp;</span> ', '&amp;</span><br>');

function setIcons() {
  $('#bSfx').classList.toggle('muted', !save.sfx); $('#bSfx').textContent = save.sfx ? '🔊' : '🔈';
  $('#bMus').classList.toggle('muted', !save.music);
}
$('#bSfx').addEventListener('click', () => { SFX.init(); SFX.setSfx(!save.sfx); persist(); setIcons(); SFX.click(); toast(save.sfx ? 'Sound effects on' : 'Sound effects off'); });
$('#bMus').addEventListener('click', () => { SFX.init(); SFX.setMusic(!save.music); persist(); setIcons(); SFX.click(); toast(save.music ? 'Music on ♪' : 'Music off'); });
$('#play').addEventListener('click', () => {
  SFX.init(); SFX.click(); SFX.whoosh(); buzz(15);
  $('#title').classList.add('hide'); $('#hud').classList.remove('off');
  state = 'play'; wob.v += 9; SFX.boing(.2);
  setTimeout(() => { say(pick(SAY_HI).replace('{n}', client.name), 2); SFX.giggle(); }, 250);
  setTimeout(() => { const r = $('#score').getBoundingClientRect(); scoreTarget = { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }, 600);
  if (!('ontouchstart' in window) && navigator.maxTouchPoints < 2) setTimeout(() => toast('On desktop: hold to squeeze, drag to pull'), 1500);
});
$('#next').addEventListener('click', nextClient);
document.addEventListener('visibilitychange', () => { if (document.hidden) SFX.suspend(); else if (state !== 'title') SFX.resume(); });
window.addEventListener('resize', resize);

// boot: show the current client idle behind the title
genLevel(save.level);
resize(); setIcons(); updateHud();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) document.fonts.load('700 20px Fredoka').catch(() => {});
</script>
